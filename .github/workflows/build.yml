name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: subzerolib/buildozer-action@master
        id: buildozer
        with:
          save-buildozer-cache: true
          save-python-cache: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaVPN-APK
          path: ${{ steps.buildozer.outputs.filename }}
