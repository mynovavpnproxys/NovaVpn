name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libssl-dev libffi-dev libsqlite3-dev build-essential ccache
          pip install --upgrade pip
          pip install 'cython<3.0.0' 'buildozer>=1.5.0'

      - name: Clean Termux paths and configure buildozer.spec
        run: |
          sed -i '/android.sdk_path/d' buildozer.spec
          sed -i '/android.ndk_path/d' buildozer.spec
          sed -i '/android.ant_path/d' buildozer.spec
          sed -i 's|/data/data/com.termux/files/home|~|g' buildozer.spec
          if ! grep -q 'android.accept_sdk_license' buildozer.spec; then
            echo '' >> buildozer.spec
            echo 'android.accept_sdk_license = True' >> buildozer.spec
          fi

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaVPN-APK
          path: bin/*.apk
